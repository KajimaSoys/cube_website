worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Образ nginx-unprivileged работает с read-only ФС: временные файлы — только в /tmp (tmpfs).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    server_tokens off;
    client_max_body_size 100M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Реальный IP клиента. Сюда ходит только nginx хоста (порт опубликован на 127.0.0.1)
    # через docker-шлюз из приватной сети. Он кладёт адрес клиента в X-Real-IP.
    # Доверяем заголовку только из приватных сетей, поэтому подделать его снаружи нельзя.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # Ограничение частоты запросов по IP клиента.
    #   order — создание заказа: каждый заказ отправляет платную SMS;
    #   login — вход в админку: защита от подбора пароля;
    #   api   — остальное API: защита от выкачивания и перегрузки.
    limit_req_zone $binary_remote_addr zone=order:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_status 429;

    # Схему (https) выставляет nginx хоста. Пробрасываем её дальше в Django; если заголовка нет — берём свою.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream django {
        server django:8000;
    }

    server {
        listen 8080;

        # Общие заголовки для проксирования в Django (наследуются всеми location ниже).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Заголовки для SPA. Для /admin и /api их ставит Django, поэтому на уровне server их нет (иначе дубли).
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # Встраивать сайт в iframe можно только самому себе и Яндекс.Метрике (карта кликов).
            add_header Content-Security-Policy "frame-ancestors 'self' https://metrika.yandex.ru https://*.metrika.yandex.ru https://webvisor.com https://*.webvisor.com" always;
        }

        location = /admin/login/ {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://django;
        }

        location /admin {
            proxy_pass http://django;
        }

        location = /api/v1/create_order/ {
            limit_req zone=order burst=5 nodelay;
            client_max_body_size 64k;
            proxy_pass http://django;
        }

        location /api/v1 {
            limit_req zone=api burst=60 nodelay;
            client_max_body_size 1m;
            proxy_pass http://django;
        }

        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Загруженные файлы. Даже если в media окажется HTML или SVG со скриптом,
        # при прямом открытии браузер выполнит его в sandbox без доступа к сайту.
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        }
    }
}
