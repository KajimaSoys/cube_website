name: cube_website

# Общие настройки защиты для всех контейнеров.
x-hardening: &hardening
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256

services:
  django:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: cube_website-django:latest
    container_name: django-cube
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthcheck/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: cube_website-nginx:latest
    container_name: nginx-cube
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./static:/app/static:ro
      - ./media:/app/media:ro
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    <<: *hardening
    # Официальный postgres:18.7-trixie + обновления безопасности Debian.
    # gosu не нужен: контейнер сразу стартует от пользователя postgres (см. user ниже).
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:18.7-trixie
        RUN apt-get update && apt-get upgrade -y --no-install-recommends && rm -rf /var/lib/apt/lists/* \
            && rm -f /usr/local/bin/gosu
    image: cube_website-db:18.7
    container_name: db-cube
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Сразу от postgres (uid 999): entrypoint не переключает пользователя, поэтому capabilities не нужны совсем.
    user: postgres
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    shm_size: 128m
    volumes:
      # С Postgres 18 том монтируется в /var/lib/postgresql, данные лежат в /var/lib/postgresql/18/docker.
      - db18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  # Том Postgres 16 (db_data) не удаляется и остаётся для отката, пока вы не удалите его вручную.
  db18_data:

networks:
  default:
    name: cube_network
    external: true
